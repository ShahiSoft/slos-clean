<!-- Edge case: Various valid labeling methods for form inputs -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Implicit Labels Edge Cases</title>
</head>
<body>
    <main>
        <h1>Valid Form Labeling Methods</h1>
        
        <form action="/submit" method="post">
            
            <!-- Method 1: Explicit label with for attribute (PASS) -->
            <div>
                <label for="explicit-input">Explicit Label</label>
                <input type="text" id="explicit-input" name="explicit">
            </div>
            
            <!-- Method 2: Wrapped/implicit label (PASS) -->
            <label>
                Wrapped Label
                <input type="text" name="wrapped">
            </label>
            
            <!-- Method 3: aria-label (PASS) -->
            <div>
                <input type="search" aria-label="Search products" name="search">
                <button type="submit">Search</button>
            </div>
            
            <!-- Method 4: aria-labelledby (PASS) -->
            <div>
                <span id="qty-label">Quantity</span>
                <input type="number" aria-labelledby="qty-label" name="quantity">
            </div>
            
            <!-- Method 5: aria-labelledby with multiple IDs (PASS) -->
            <div>
                <span id="fname-label">First Name</span>
                <span id="fname-required">(required)</span>
                <input type="text" 
                       aria-labelledby="fname-label fname-required" 
                       name="firstname" 
                       required>
            </div>
            
            <!-- Method 6: title attribute (fallback, PASS but not ideal) -->
            <div>
                <input type="text" title="Enter ZIP code" name="zipcode">
            </div>
            
            <!-- Method 7: Fieldset + legend for groups (PASS) -->
            <fieldset>
                <legend>Contact Preference</legend>
                <div>
                    <input type="radio" id="pref-email" name="preference" value="email">
                    <label for="pref-email">Email</label>
                </div>
                <div>
                    <input type="radio" id="pref-phone" name="preference" value="phone">
                    <label for="pref-phone">Phone</label>
                </div>
            </fieldset>
            
            <!-- Method 8: Button with inner text (PASS) -->
            <button type="submit">Submit Form</button>
            
            <!-- Method 9: Button with aria-label (PASS) -->
            <button type="button" aria-label="Close dialog">
                <span aria-hidden="true">&times;</span>
            </button>
            
            <!-- Method 10: Input type=image with alt (PASS) -->
            <input type="image" src="submit.png" alt="Submit application">
            
            <!-- Method 11: Select with label (PASS) -->
            <div>
                <label for="country-select">Country</label>
                <select id="country-select" name="country">
                    <option value="">Select country</option>
                    <option value="us">United States</option>
                    <option value="ca">Canada</option>
                </select>
            </div>
            
            <!-- Method 12: Textarea with label (PASS) -->
            <div>
                <label for="message-textarea">Your Message</label>
                <textarea id="message-textarea" name="message" rows="4"></textarea>
            </div>
            
            <!-- Method 13: Combobox pattern with aria-labelledby (PASS) -->
            <div>
                <label id="combo-label">Choose a fruit</label>
                <div role="combobox" 
                     aria-expanded="false"
                     aria-labelledby="combo-label"
                     aria-controls="listbox-1">
                    <input type="text" aria-autocomplete="list">
                </div>
                <ul role="listbox" id="listbox-1">
                    <li role="option">Apple</li>
                    <li role="option">Banana</li>
                </ul>
            </div>
            
            <!-- Edge: Visually hidden label (still accessible) (PASS) -->
            <div>
                <label for="hidden-label-input" class="visually-hidden">
                    Screen reader only label
                </label>
                <input type="text" id="hidden-label-input" name="hidden-label">
            </div>
            
        </form>
    </main>
    
    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</body>
</html>
