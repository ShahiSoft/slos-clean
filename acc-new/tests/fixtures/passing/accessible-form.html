<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form Test</title>
</head>
<body>
    <main>
        <h1>Accessible Form Examples</h1>
        
        <!-- Form with explicit labels -->
        <form action="/submit" method="post">
            <h2>Contact Information</h2>
            
            <!-- Standard label association -->
            <div>
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
            </div>
            
            <div>
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
            </div>
            
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       aria-describedby="email-help">
                <span id="email-help" class="help-text">We'll never share your email.</span>
            </div>
            
            <div>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
            </div>
            
            <!-- Wrapped label pattern -->
            <label>
                <span>Subscribe to newsletter</span>
                <input type="checkbox" name="subscribe">
            </label>
            
            <!-- aria-label for search -->
            <div>
                <input type="search" aria-label="Search our products" name="search">
                <button type="submit" aria-label="Submit search">🔍</button>
            </div>
            
            <!-- aria-labelledby pattern -->
            <div>
                <span id="qty-label">Quantity</span>
                <input type="number" aria-labelledby="qty-label" name="quantity" min="1" max="100">
            </div>
            
            <!-- Fieldset with legend for grouped controls -->
            <fieldset>
                <legend>Shipping Options</legend>
                <div>
                    <input type="radio" id="shipping-standard" name="shipping" value="standard" checked>
                    <label for="shipping-standard">Standard (5-7 days)</label>
                </div>
                <div>
                    <input type="radio" id="shipping-express" name="shipping" value="express">
                    <label for="shipping-express">Express (2-3 days)</label>
                </div>
                <div>
                    <input type="radio" id="shipping-overnight" name="shipping" value="overnight">
                    <label for="shipping-overnight">Overnight (1 day)</label>
                </div>
            </fieldset>
            
            <!-- Select with proper label -->
            <div>
                <label for="country">Country</label>
                <select id="country" name="country" autocomplete="country">
                    <option value="">Select a country</option>
                    <option value="us">United States</option>
                    <option value="ca">Canada</option>
                    <option value="uk">United Kingdom</option>
                </select>
            </div>
            
            <!-- Textarea with label and description -->
            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" 
                          aria-describedby="message-count"></textarea>
                <span id="message-count" aria-live="polite">0/500 characters</span>
            </div>
            
            <!-- Error container with live region -->
            <div id="form-errors" role="alert" aria-live="assertive"></div>
            
            <button type="submit">Submit Form</button>
        </form>
    </main>
</body>
</html>
