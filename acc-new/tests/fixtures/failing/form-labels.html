<!-- EXPECTED: missing-form-label check should FAIL -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Label Issues Test</title>
</head>
<body>
    <main>
        <h1>Forms Without Proper Labels</h1>
        
        <form action="/submit" method="post">
            <!-- No label at all -->
            <input type="text" name="username">
            
            <!-- Placeholder is NOT a label -->
            <input type="email" name="email" placeholder="Email address">
            
            <!-- Label exists but not associated -->
            <label>Phone Number</label>
            <input type="tel" name="phone">
            
            <!-- Wrong for attribute -->
            <label for="wrong-id">Street Address</label>
            <input type="text" name="address" id="address">
            
            <!-- Select without label -->
            <select name="country">
                <option value="">Select country</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
            </select>
            
            <!-- Textarea without label -->
            <textarea name="message" placeholder="Your message"></textarea>
            
            <!-- Radio buttons without fieldset/legend -->
            <div>
                <input type="radio" name="gender" value="male" id="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" value="female" id="female">
                <label for="female">Female</label>
                <!-- Group has no overall label -->
            </div>
            
            <!-- Checkbox without label -->
            <input type="checkbox" name="newsletter">
            Subscribe to newsletter
            
            <!-- Hidden label (problematic) -->
            <label for="search" style="display: none;">Search</label>
            <input type="search" id="search" name="search">
            
            <!-- File input without label -->
            <input type="file" name="document">
            
            <!-- Multiple inputs with same ID -->
            <label for="date">Start Date</label>
            <input type="date" name="start_date" id="date">
            <label for="date">End Date</label>
            <input type="date" name="end_date" id="date">
            
            <!-- Required field with no indication -->
            <input type="text" name="required_field" required>
            
            <!-- Empty label -->
            <label for="empty-label"></label>
            <input type="text" id="empty-label" name="empty_label">
            
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
