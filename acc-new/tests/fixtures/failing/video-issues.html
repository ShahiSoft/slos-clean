<!-- EXPECTED: video-accessibility check should FAIL -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Accessibility Issues Test</title>
</head>
<body>
    <main>
        <h1>Video Accessibility Issues</h1>
        
        <!-- Video without controls -->
        <section>
            <h2>Video Without Controls</h2>
            <video autoplay>
                <source src="video.mp4" type="video/mp4">
            </video>
        </section>
        
        <!-- Video without captions -->
        <section>
            <h2>Video Without Captions</h2>
            <video controls>
                <source src="presentation.mp4" type="video/mp4">
                <!-- No track element for captions -->
            </video>
        </section>
        
        <!-- Autoplay video (accessibility concern) -->
        <section>
            <h2>Autoplay Videos</h2>
            <video autoplay muted>
                <source src="background.mp4" type="video/mp4">
            </video>
            
            <video autoplay loop>
                <source src="looping.mp4" type="video/mp4">
            </video>
        </section>
        
        <!-- Audio without transcript link -->
        <section>
            <h2>Audio Without Transcript</h2>
            <audio controls>
                <source src="podcast.mp3" type="audio/mpeg">
            </audio>
            <!-- No transcript provided -->
        </section>
        
        <!-- Embedded video without title -->
        <section>
            <h2>Embedded Videos</h2>
            
            <!-- YouTube without title -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                    width="560" height="315"
                    allowfullscreen>
            </iframe>
            
            <!-- Vimeo without title -->
            <iframe src="https://player.vimeo.com/video/123456789"
                    width="640" height="360"
                    allowfullscreen>
            </iframe>
        </section>
        
        <!-- Video with insufficient captions -->
        <section>
            <h2>Video With Auto-Generated Captions Only</h2>
            <video controls>
                <source src="interview.mp4" type="video/mp4">
                <track kind="captions" src="auto-captions.vtt" srclang="en" label="Auto-generated">
                <!-- No human-verified captions -->
            </video>
        </section>
        
        <!-- Embedded content blocking keyboard -->
        <section>
            <h2>Inaccessible Embed</h2>
            <object data="flash-video.swf" type="application/x-shockwave-flash">
                <!-- Flash content is inaccessible -->
            </object>
            
            <embed src="video-player.swf" type="application/x-shockwave-flash">
        </section>
        
        <!-- Video background (decorative but no alternative) -->
        <section style="position: relative;">
            <video autoplay muted loop playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                <source src="hero-background.mp4" type="video/mp4">
            </video>
            <div style="position: relative; z-index: 1;">
                <h2>Hero Section</h2>
                <p>No alternative for the background video content.</p>
            </div>
        </section>
    </main>
</body>
</html>
