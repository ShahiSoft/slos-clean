<!-- EXPECTED: missing-alt-text check should FAIL -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Missing Alt Text Test</title>
</head>
<body>
    <main>
        <h1>Images Without Proper Alt Text</h1>
        
        <!-- Missing alt attribute entirely -->
        <img src="product1.jpg">
        
        <!-- Empty alt (may be valid for decorative, but not for linked images) -->
        <a href="/product"><img src="product2.jpg" alt=""></a>
        
        <!-- Whitespace-only alt -->
        <img src="product3.jpg" alt="   ">
        
        <!-- Generic unhelpful alt text -->
        <img src="chart.png" alt="image">
        <img src="photo.jpg" alt="photo">
        <img src="picture.jpg" alt="picture">
        
        <!-- Filename as alt text -->
        <img src="products/IMG_1234.jpg" alt="IMG_1234.jpg">
        <img src="assets/DSC_0001.png" alt="DSC_0001.png">
        
        <!-- Just "icon" or "logo" without context -->
        <img src="logo.svg" alt="logo">
        <img src="icon-arrow.png" alt="icon">
        
        <!-- Redundant text with link -->
        <a href="/product">
            <img src="widget.jpg" alt="Widget">
            Widget
        </a>
        
        <!-- Background image with content (should have alt text mechanism) -->
        <div style="background-image: url('hero.jpg')" role="img">
            <!-- No aria-label -->
        </div>
    </main>
</body>
</html>
