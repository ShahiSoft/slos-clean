<!-- EXPECTED: invalid-aria-combination check should PASS -->
<!-- Valid ARIA attribute combinations -->
<div>
    <!-- Visible and focusable -->
    <button tabindex="0">
        Visible button
    </button>
    
    <!-- Decorative without ARIA -->
    <div role="presentation">
        Decorative element
    </div>
    
    <!-- Valid labelledby reference -->
    <span id="username-label">Username</span>
    <input type="text" aria-labelledby="username-label">
    
    <!-- aria-required on input -->
    <label for="email-input">Email</label>
    <input type="email" id="email-input" aria-required="true">
    
    <!-- Visible navigation -->
    <nav>
        <ul><li><a href="#">Visible link</a></li></ul>
    </nav>
    
    <!-- Hidden non-focusable -->
    <div aria-hidden="true">
        <span>Hidden decoration</span>
    </div>
</div>
